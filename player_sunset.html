<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sunset Player</title>
<style>
  :root{
    --gold:#FFD27A; --amber:#FFA23C; --orange:#FF7A3D; --coral:#E8485A; --pink:#FF4F8B;
    --plum:#2A0F3A; --ink:#0A0410; --cream:#FFE9CF; --muted:#E2B7A6; --muted-dim:#9C7A78;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; background:#0E0618; overflow:hidden; color:#fff;
    font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif; }

  /* --hz / --sx / --sy are set by JS (layout()) so horizon + sun always match the art position */
  .shell{ --hz:46%; --sx:50%; --sy:30%; --sun:min(56vw,26vh,250px);
    position:relative; width:100%; height:100%; overflow:hidden; }

  /* ================= SKY ================= */
  .sky{ position:absolute; left:0; right:0; top:0; height:var(--hz); overflow:hidden; z-index:0;
    background:linear-gradient(180deg,#090A28 0%,#1C0F47 17%,#4A1B6B 34%,#9A2F78 52%,#E0485A 71%,#FF8A3C 87%,#FFD08A 100%); }
  .sky-warm{ position:absolute; inset:0; background:linear-gradient(180deg,transparent 30%,rgba(255,120,60,.55) 100%); opacity:.15; animation:warmBreath 16s ease-in-out infinite alternate; }
  @keyframes warmBreath{ to{ opacity:.55; } }
  .stars{ position:absolute; inset:0; -webkit-mask-image:linear-gradient(#000 0%,transparent 62%); mask-image:linear-gradient(#000 0%,transparent 62%); }
  .stars i{ position:absolute; border-radius:50%; background:#fff; animation:twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle{ from{ opacity:.1; } to{ opacity:.85; } }

  .sunburst{ position:absolute; left:var(--sx); top:var(--sy); width:calc(var(--sun)*5.2); height:calc(var(--sun)*5.2);
    margin:calc(var(--sun)*-2.6) 0 0 calc(var(--sun)*-2.6); border-radius:50%; opacity:.26; mix-blend-mode:screen;
    background:repeating-conic-gradient(from 0deg, rgba(255,214,150,.65) 0deg 2deg, transparent 2deg 11deg);
    -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%); mask-image:radial-gradient(circle,#000 10%,transparent 60%);
    animation:burstSpin 170s linear infinite; will-change:transform; }
  @keyframes burstSpin{ to{ transform:rotate(360deg); } }
  .halo{ position:absolute; left:var(--sx); top:var(--sy); width:calc(var(--sun)*3.6); height:calc(var(--sun)*3.6);
    margin:calc(var(--sun)*-1.8) 0 0 calc(var(--sun)*-1.8); border-radius:50%; will-change:transform,opacity;
    background:radial-gradient(circle, rgba(255,232,160,.95) 0%, rgba(255,176,76,.58) 22%, rgba(255,96,64,.24) 44%, rgba(255,60,90,0) 68%); }
  .hz-glow{ position:absolute; left:0; right:0; bottom:0; height:34%;
    background:linear-gradient(to bottom, transparent, rgba(255,166,86,.38) 65%, rgba(255,222,150,.7)); }

  .cloud{ position:absolute; left:0; height:var(--h,18px); width:var(--w,170px); border-radius:50%;
    background:linear-gradient(180deg, rgba(70,24,92,.6) 0%, rgba(214,80,104,.62) 55%, rgba(255,176,104,.9) 100%);
    filter:blur(3.5px); opacity:var(--op,.8); animation:cloudDrift var(--dur,100s) linear infinite; animation-delay:var(--dl,0s); will-change:transform; }
  .cloud::before,.cloud::after{ content:""; position:absolute; border-radius:50%; background:inherit; }
  .cloud::before{ left:14%; top:-55%; width:42%; height:135%; }
  .cloud::after{ left:50%; top:-38%; width:34%; height:112%; }
  @keyframes cloudDrift{ from{ transform:translateX(-45vw); } to{ transform:translateX(105vw); } }

  /* ================= LAND ================= */
  .mtn{ position:absolute; left:0; width:100%; height:50px; top:calc(var(--hz) - 50px); z-index:1; display:block; }
  .shore{ position:absolute; z-index:2; pointer-events:none; bottom:calc(100% - var(--hz) - 6px); }
  .shore svg, .shore-refl svg{ display:block; width:100%; height:100%; fill:#0A0410; overflow:visible; }
  .shore-l{ left:0; width:62vw; aspect-ratio:260/150; }
  .shore-r{ right:0; width:46vw; aspect-ratio:200/140; }
  .st{ fill:none; stroke:#0A0410; stroke-linecap:round; }
  .land{ stroke:rgba(255,150,80,.3); stroke-width:1; }
  .sway{ animation:sway 8s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(-.7deg); } to{ transform:rotate(.9deg); } }

  /* ================= WATER ================= */
  .water{ position:absolute; left:0; right:0; top:var(--hz); bottom:0; z-index:1; overflow:hidden;
    background:linear-gradient(180deg,#F29A55 0%,#C9485F 6%,#8A2C6A 18%,#4A1858 38%,#241038 66%,#0E0618 100%); }
  .water::before{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,transparent,rgba(255,232,170,.95) 50%,transparent); box-shadow:0 0 14px 2px rgba(255,200,120,.7); }
  .water-shade{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,6,30,0) 0%,rgba(20,6,30,.3) 30%,rgba(8,2,14,.55) 100%); pointer-events:none; }
  .refl-glow{ position:absolute; left:50%; top:0; width:min(70vw,300px); height:72%; transform:translateX(-50%);
    background:radial-gradient(ellipse 50% 100% at 50% 0%, rgba(255,214,130,.75), rgba(255,140,70,.3) 50%, transparent 76%); will-change:opacity; }
  .refl{ position:absolute; left:50%; top:0; width:min(72vw,310px); height:64%; transform:translateX(-50%);
    -webkit-mask-image:linear-gradient(to bottom,#000 50%,transparent); mask-image:linear-gradient(to bottom,#000 50%,transparent); will-change:opacity; }
  .refl i{ position:absolute; display:block; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,240,180,.98), rgba(255,176,80,.6) 55%, transparent 76%);
    animation:glint ease-in-out infinite alternate; }
  @keyframes glint{ from{ transform:scaleX(.45); opacity:calc(var(--o)*.28); } to{ transform:scaleX(1.06); opacity:var(--o); } }
  .rp{ position:absolute; display:block; border-radius:50%; animation:rpDrift ease-in-out infinite alternate; }
  .rp.l{ background:linear-gradient(90deg,transparent,rgba(255,200,160,.5),transparent); }
  .rp.d{ background:linear-gradient(90deg,transparent,rgba(20,4,30,.55),transparent); }
  @keyframes rpDrift{ from{ transform:translateX(calc(var(--dx)*-1)); } to{ transform:translateX(var(--dx)); } }
  .shore-refl{ position:absolute; top:6px; opacity:.4; filter:blur(1.2px); transform-origin:50% 50%; animation:reflWob 6s ease-in-out infinite;
    -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.95),transparent 78%); mask-image:linear-gradient(to top,rgba(0,0,0,.95),transparent 78%); pointer-events:none; }
  .shore-refl.l{ left:0; width:62vw; aspect-ratio:260/150; }
  .shore-refl.r{ right:0; width:46vw; aspect-ratio:200/140; }
  @keyframes reflWob{ 0%,100%{ transform:scaleY(-1) translateX(0); } 50%{ transform:scaleY(-1) translateX(3px) skewX(1deg); } }

  .boat{ position:absolute; z-index:2; left:0; top:calc(var(--hz) - 27px); width:40px; height:34px; pointer-events:none;
    animation:boatMove 170s linear infinite; animation-delay:-70s; will-change:transform; }
  .boat .bob{ animation:boatBob 3.4s ease-in-out infinite alternate; }
  .boat svg{ display:block; width:40px; height:34px; fill:#0A0410; }
  .boat svg .m{ stroke:#0A0410; stroke-width:1; }
  .boat .rf{ position:absolute; left:0; top:32px; opacity:.3; filter:blur(1px); transform:scaleY(-1); }
  @keyframes boatMove{ from{ transform:translateX(-60px); } to{ transform:translateX(calc(100vw + 60px)); } }
  @keyframes boatBob{ from{ transform:translateY(0) rotate(-1.2deg); } to{ transform:translateY(1.5px) rotate(1.2deg); } }

  /* ================= CONTENT ================= */
  .content{ position:relative; z-index:3; height:100%; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(env(safe-area-inset-bottom,0px) + 16px); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; }
  .topbar-actions{ display:flex; gap:8px; }
  .icon-btn{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff;
    background:rgba(24,6,32,.4); border:1px solid rgba(255,230,200,.2); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .eyebrow{ font-size:12px; letter-spacing:2px; font-weight:600; color:var(--cream); text-shadow:0 1px 8px rgba(40,5,30,.7); }

  .art-wrap{ position:relative; width:var(--sun); height:var(--sun); margin:56px auto 0; flex-shrink:0; }
  .art{ position:absolute; inset:0; border-radius:50%; background-size:cover; background-position:center; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    border:3px solid rgba(255,226,170,.6);
    box-shadow:0 0 44px 10px rgba(255,150,60,.55), 0 0 0 7px rgba(255,200,120,.14), inset 0 0 34px rgba(255,120,40,.4);
    animation:breathe 6s ease-in-out infinite; }
  .art::after{ content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, rgba(255,250,220,.4), transparent 42%), radial-gradient(circle at 50% 108%, rgba(255,110,50,.5), transparent 60%); }
  .art.placeholder{ background:radial-gradient(circle at 50% 46%, #FFF6D0 0%, #FFD36B 34%, #FF8A3C 68%, #E0485A 100%); }
  .art svg{ width:22%; height:22%; opacity:.4; position:relative; z-index:1; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.022); } }

  /* radial visualizer: rays around the sun */
  .rays{ position:absolute; inset:0; pointer-events:none; }
  .ray{ position:absolute; left:50%; top:50%; width:3px; height:34px; margin-left:-1.5px; transform-origin:50% 0; }
  .ray i{ display:block; width:100%; height:100%; border-radius:2px; transform-origin:50% 0; transform:scaleY(.2);
    background:linear-gradient(to bottom,#FFF0B8 0%,#FFB347 50%,rgba(255,79,139,0) 100%);
    box-shadow:0 0 6px rgba(255,170,70,.6); will-change:transform; animation:shimmer 2.4s ease-in-out infinite alternate; }
  @keyframes shimmer{ from{ transform:scaleY(calc(.16*var(--f,1))); } to{ transform:scaleY(calc(.62*var(--f,1))); } }
  .rays.live i{ animation:none; transition:transform .07s linear; }
  .rays.paused{ opacity:.55; }
  .rays.paused:not(.live) i{ animation-play-state:paused; }

  .track-info{ position:relative; text-align:center; margin-top:54px; }
  .track-info::before{ content:""; position:absolute; inset:-18px -44px; z-index:-1; background:radial-gradient(ellipse at center,rgba(22,5,30,.58),transparent 70%); }
  .track-title{ font-family:"Noto Serif","Source Serif Pro",Georgia,serif; font-size:22px; font-weight:600; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 12px rgba(30,5,30,.85); }
  .track-artist{ font-size:13.5px; color:var(--cream); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 8px rgba(30,5,30,.8); }

  .seek-row{ display:flex; align-items:center; gap:10px; margin-top:2.6vh; }
  .time{ font-size:11px; color:var(--cream); width:34px; text-shadow:0 1px 6px rgba(30,5,30,.8); }
  .track-bar{ flex:1; height:24px; position:relative; display:flex; align-items:center; touch-action:none; }
  .track-bg{ position:absolute; left:0; right:0; height:4px; border-radius:3px; background:rgba(255,230,200,.22); }
  .track-fill{ position:absolute; left:0; top:50%; transform:translateY(-50%); height:4px; width:0; border-radius:3px; background:linear-gradient(to right,var(--gold),var(--pink)); }
  .track-thumb{ position:absolute; left:0; top:50%; transform:translate(-50%,-50%); width:15px; height:15px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#FFF6D0,#FFB347 70%); box-shadow:0 0 14px 3px rgba(255,190,90,.85); }

  .controls{ display:flex; align-items:center; justify-content:space-between; margin-top:2.8vh; padding:0 2px; }
  .ctrl-btn{ background:none; border:none; color:var(--cream); display:flex; align-items:center; justify-content:center; padding:8px; filter:drop-shadow(0 1px 6px rgba(30,5,30,.7)); }
  .ctrl-btn.small{ width:38px; height:38px; opacity:.8; }
  .ctrl-btn.mid{ width:50px; height:50px; color:#fff; }
  .ctrl-btn.active{ opacity:1; color:var(--gold); background:rgba(255,210,122,.2); border-radius:12px; }
  .play-btn{ width:72px; height:72px; border:none; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; transition:transform .15s;
    background:radial-gradient(circle at 35% 30%,#FFF0B8,#FFB347 46%,#FF6A3D 100%);
    box-shadow:0 0 0 6px rgba(255,170,80,.16), 0 10px 30px rgba(255,100,50,.55); }
  .play-btn:active{ transform:scale(.93); }
  .play-btn::after{ content:""; position:absolute; inset:-9px; border-radius:50%; border:1.5px solid rgba(255,210,122,.5); animation:pulseRing 2.8s ease-out infinite; }
  .play-btn.paused::after{ animation-play-state:paused; opacity:0; }
  @keyframes pulseRing{ 0%{ transform:scale(.9); opacity:.7; } 100%{ transform:scale(1.4); opacity:0; } }

  .bottom-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:1.5vh; }
  .pill{ display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:20px; font-size:12px; color:var(--cream);
    background:rgba(24,6,32,.45); border:1px solid rgba(255,230,200,.2); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .pill.liked{ color:var(--gold); border-color:rgba(255,210,122,.65); }

  /* ================= BIRDS (above everything, no touch) ================= */
  .birds{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .bird{ position:absolute; left:0; will-change:transform; animation:fly linear infinite; }
  .bird.rev{ animation-name:flyRev; }
  .bird .bob{ animation:bob 3.6s ease-in-out infinite alternate; }
  .bird.rev svg{ transform:scaleX(-1); }
  .bird svg{ display:block; }
  @keyframes fly{ from{ transform:translateX(-130px); } to{ transform:translateX(calc(100vw + 60px)); } }
  @keyframes flyRev{ from{ transform:translateX(calc(100vw + 60px)); } to{ transform:translateX(-130px); } }
  @keyframes bob{ from{ transform:translateY(-6px) rotate(-2deg); } to{ transform:translateY(8px) rotate(2deg); } }

  /* ================= QUEUE ================= */
  .q-backdrop{ position:fixed; inset:0; background:rgba(10,4,14,.62); opacity:0; pointer-events:none; transition:opacity .25s; z-index:6; }
  .q-backdrop.open{ opacity:1; pointer-events:auto; }
  .q-panel{ position:fixed; left:0; right:0; bottom:0; max-height:62vh; background:#2A1238; border-radius:22px 22px 0 0;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.3,1); z-index:7; display:flex; flex-direction:column; box-shadow:0 -12px 30px rgba(0,0,0,.5); }
  .q-panel.open{ transform:translateY(0); }
  .q-handle{ width:38px; height:4px; border-radius:3px; background:rgba(255,255,255,.2); margin:10px auto 4px; }
  .q-header{ display:flex; align-items:center; justify-content:space-between; padding:8px 18px 10px; }
  .q-title{ font-size:15px; font-weight:800; }
  .q-close{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.1); }
  .q-list{ overflow-y:auto; padding:2px 8px 18px; scrollbar-width:none; }
  .q-list::-webkit-scrollbar{ display:none; }
  .q-row{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; }
  .q-num{ width:22px; text-align:center; font-size:12px; color:var(--muted-dim); }
  .q-info{ flex:1; min-width:0; }
  .q-t{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q-s{ font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q-dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); opacity:0; flex-shrink:0; }
  .q-row.playing{ background:rgba(255,210,122,.15); }
  .q-row.playing .q-t,.q-row.playing .q-num{ color:var(--gold); }
  .q-row.playing .q-dot{ opacity:1; }
  .q-empty{ text-align:center; color:var(--muted-dim); font-size:12.5px; padding:24px 0; }
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- ===== SKY ===== -->
  <div class="sky">
    <div class="stars" id="stars"></div>
    <div class="sky-warm"></div>
    <div class="sunburst" id="sunburst"></div>
    <div class="halo" id="halo"></div>
    <div class="hz-glow"></div>
    <div class="cloud" style="top:calc(var(--hz)*.12);--w:150px;--h:12px;--op:.55;--dur:130s;--dl:-30s"></div>
    <div class="cloud" style="top:calc(var(--hz)*.22);--w:230px;--h:16px;--op:.7;--dur:110s;--dl:-70s"></div>
    <div class="cloud" style="top:calc(var(--hz)*.36);--w:200px;--h:18px;--op:.85;--dur:95s;--dl:-10s"></div>
    <div class="cloud" style="top:calc(var(--hz)*.5);--w:280px;--h:20px;--op:.9;--dur:120s;--dl:-90s"></div>
    <div class="cloud" style="top:calc(var(--hz)*.64);--w:190px;--h:14px;--op:.95;--dur:85s;--dl:-45s"></div>
    <div class="cloud" style="top:calc(var(--hz)*.76);--w:240px;--h:12px;--op:.95;--dur:105s;--dl:-60s"></div>
  </div>

  <!-- far + near mountain ridges (valley under the sun) -->
  <svg class="mtn" viewBox="0 0 400 50" preserveAspectRatio="none">
    <defs><linearGradient id="mg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B3A86"/><stop offset="1" stop-color="#D2606A"/></linearGradient></defs>
    <path d="M0,50 L0,30 L24,22 L52,32 L84,16 L118,30 L146,22 L170,36 L200,42 L230,36 L262,24 L296,34 L330,18 L364,30 L400,24 L400,50 Z" fill="url(#mg1)" opacity=".85"/>
  </svg>
  <svg class="mtn" viewBox="0 0 400 50" preserveAspectRatio="none" style="height:38px;top:calc(var(--hz) - 38px)">
    <path d="M0,50 L0,30 L40,22 L80,32 L130,24 L170,38 L200,42 L230,38 L280,26 L330,34 L370,22 L400,28 L400,50 Z" fill="#33143F"/>
  </svg>

  <!-- ===== WATER ===== -->
  <div class="water" id="water">
    <div class="refl-glow" id="reflGlow"></div>
    <div class="refl" id="refl"></div>
    <div id="ripples"></div>
    <div class="shore-refl l"><svg id="shoreLr" viewBox="0 0 260 150" preserveAspectRatio="xMinYMax meet"></svg></div>
    <div class="shore-refl r"><svg id="shoreRr" viewBox="0 0 200 140" preserveAspectRatio="xMaxYMax meet"></svg></div>
    <div class="water-shade"></div>
  </div>

  <!-- ===== SHORES (dark trees) ===== -->
  <div class="shore shore-l"><svg id="shoreL" viewBox="0 0 260 150" preserveAspectRatio="xMinYMax meet"></svg></div>
  <div class="shore shore-r"><svg id="shoreR" viewBox="0 0 200 140" preserveAspectRatio="xMaxYMax meet"></svg></div>

  <!-- sailboat with reflection -->
  <div class="boat">
    <div class="bob">
      <svg viewBox="0 0 40 34"><path d="M3,26 L37,26 L31,32 L9,32 Z"/><path d="M19,4 L19,24 L6,24 Z"/><path d="M22,8 L22,24 L35,24 Z"/><path class="m" d="M20.5,2 L20.5,26"/></svg>
      <svg class="rf" viewBox="0 0 40 34"><path d="M3,26 L37,26 L31,32 L9,32 Z"/><path d="M19,4 L19,24 L6,24 Z"/><path d="M22,8 L22,24 L35,24 Z"/></svg>
    </div>
  </div>

  <!-- ===== CONTENT ===== -->
  <div class="content">
    <div class="topbar">
      <div class="icon-btn" id="btnCollapse"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <div class="eyebrow">Golden hour</div>
      <div class="topbar-actions">
        <div class="icon-btn" id="btnEqualizer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></div>
        <div class="icon-btn" id="btnTheme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/></svg></div>
      </div>
    </div>

    <div class="art-wrap" id="artWrap">
      <div class="rays live-off" id="rays"></div>
      <div class="art placeholder" id="art">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5A1F3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Loading…</div>
      <div class="track-artist" id="trackArtist"></div>
    </div>

    <div class="seek-row">
      <div class="time" id="timeNow">0:00</div>
      <div class="track-bar" id="seekBar">
        <div class="track-bg"></div><div class="track-fill" id="trackFill"></div><div class="track-thumb" id="trackThumb"></div>
      </div>
      <div class="time" id="timeTotal" style="text-align:right">0:00</div>
    </div>

    <div class="controls">
      <button class="ctrl-btn small" id="btnShuffle"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
      <button class="ctrl-btn mid" id="btnPrev"><svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><rect x="5" y="4" width="2" height="16"/></svg></button>
      <button class="play-btn paused" id="btnPlay"><svg id="playIcon" viewBox="0 0 24 24" width="27" height="27" fill="#3A1040"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
      <button class="ctrl-btn mid" id="btnNext"><svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="2" height="16"/></svg></button>
      <button class="ctrl-btn small" id="btnRepeatOne"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="10.5" y="14.5" font-size="7" stroke="none" fill="currentColor">1</text></svg></button>
    </div>

    <div class="bottom-row">
      <div class="pill" id="btnFavorite">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="favLabel">Save</span>
      </div>
      <div class="pill" id="btnQueue">Queue
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
  </div>

  <!-- big birds fly in front of the sun -->
  <div class="birds" id="birds"></div>

  <div class="q-backdrop" id="qBackdrop"></div>
  <div class="q-panel" id="qPanel">
    <div class="q-handle"></div>
    <div class="q-header">
      <div class="q-title">Up Next</div>
      <div class="q-close" id="btnQClose"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="q-list" id="qList"><div class="q-empty">Loading queue…</div></div>
  </div>
</div>

<script>
  function $(id){ return document.getElementById(id); }
  var shell = $('shell');

  // ============ LAYOUT: horizon + sun centre follow the art position ============
  function layout(){
    var art = $('artWrap'), sh = shell.getBoundingClientRect(), r = art.getBoundingClientRect();
    if (!r.width) return;
    shell.style.setProperty('--sx', (r.left - sh.left + r.width/2) + 'px');
    shell.style.setProperty('--sy', (r.top - sh.top + r.height/2) + 'px');
    shell.style.setProperty('--hz', (r.bottom - sh.top + 32) + 'px');
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });
  window.addEventListener('load', layout);
  layout(); requestAnimationFrame(layout); setTimeout(layout, 250);

  // ============ STARS ============
  (function(){
    var h = '';
    for (var i = 0; i < 34; i++) {
      var s = (Math.random() < .2 ? 2 : 1.2).toFixed(1);
      h += '<i style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*70).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(2+Math.random()*3).toFixed(1)+'s;animation-delay:-'+(Math.random()*4).toFixed(1)+'s"></i>';
    }
    $('stars').innerHTML = h;
  })();

  // ============ WATER: sun reflection glints + ripples ============
  (function(){
    var h = '', N = 38, i, t;
    for (i = 0; i < N; i++) {
      t = i/(N-1);
      var y = Math.pow(t,1.45)*100, th = 2 + t*5, w = (90 - 50*t)*(0.55 + Math.random()*0.45);
      var left = (100 - w)/2 + (Math.random()-.5)*6;
      h += '<i style="top:'+y.toFixed(1)+'%;height:'+th.toFixed(1)+'px;width:'+w.toFixed(1)+'%;left:'+left.toFixed(1)+'%;--o:'+(0.95 - t*0.6).toFixed(2)
        + ';animation-duration:'+(1.3 + Math.random()*2.3).toFixed(2)+'s;animation-delay:-'+(Math.random()*3).toFixed(2)+'s"></i>';
    }
    $('refl').innerHTML = h;

    h = '';
    for (i = 0; i < 34; i++) {
      t = i/33;
      var yy = 3 + Math.pow(t,1.5)*95, ww = 12 + t*42 + Math.random()*18, hh = 1 + t*2.2;
      h += '<i class="rp '+(Math.random()<.5?'l':'d')+'" style="top:'+yy.toFixed(1)+'%;left:'+(Math.random()*100-8).toFixed(1)+'%;width:'+ww.toFixed(1)+'%;height:'+hh.toFixed(1)
        + 'px;opacity:'+(0.12 + Math.random()*0.18).toFixed(2)+';--dx:'+(10 + Math.random()*26).toFixed(0)+'px;animation-duration:'+(4 + Math.random()*5).toFixed(1)
        + 's;animation-delay:-'+(Math.random()*6).toFixed(1)+'s"></i>';
    }
    $('ripples').innerHTML = h;
  })();

  // ============ TREES (dark silhouettes, swaying) ============
  var seed = 11;
  function rnd(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }
  function P(a){ return a[0].toFixed(1)+','+a[1].toFixed(1); }
  function pine(cx,by,h,w){
    var p = [[cx,by-h],[cx+.2*w,by-.66*h],[cx+.09*w,by-.66*h],[cx+.33*w,by-.4*h],[cx+.14*w,by-.4*h],[cx+.5*w,by-.08*h],[cx+.05*w,by-.08*h],
             [cx+.05*w,by+2],[cx-.05*w,by+2],[cx-.05*w,by-.08*h],[cx-.5*w,by-.08*h],[cx-.14*w,by-.4*h],[cx-.33*w,by-.4*h],[cx-.09*w,by-.66*h],[cx-.2*w,by-.66*h]];
    return '<path d="M'+p.map(P).join('L')+'Z"/>';
  }
  function acacia(cx,by,h){
    var tx = cx+5, ty = by-h*.6, s = '';
    s += '<path class="st" stroke-width="5.2" d="M'+(cx-2)+','+(by+2)+' C'+(cx-7)+','+(by-h*.22)+' '+(cx+9)+','+(by-h*.42)+' '+tx+','+ty+'"/>';
    var cl = [[-36,-9,24,7],[-14,-21,22,7],[14,-23,23,7.5],[38,-8,24,7],[2,-8,18,6]];
    cl.forEach(function(c){
      var x = tx+c[0], y = ty+c[1];
      s += '<path class="st" stroke-width="2.4" d="M'+tx+','+(ty+4)+' Q'+((tx+x)/2)+','+(ty-2)+' '+x+','+(y+3)+'"/>';
      s += '<ellipse cx="'+x+'" cy="'+y+'" rx="'+c[2]+'" ry="'+c[3]+'"/>';
      for (var j = 0; j < 9; j++) {
        var a = rnd()*Math.PI*2, rr = c[2]*(0.7 + rnd()*0.5);
        s += '<circle cx="'+(x+Math.cos(a)*rr*.95).toFixed(1)+'" cy="'+(y+Math.sin(a)*c[3]*1.1).toFixed(1)+'" r="'+(2+rnd()*2.6).toFixed(1)+'"/>';
      }
    });
    return s;
  }
  function sway(inner,ox,oy,dur,del){
    return '<g class="sway" style="transform-origin:'+ox+'px '+oy+'px;animation-duration:'+dur+'s;animation-delay:'+del+'s">'+inner+'</g>';
  }
  function shoreLeft(){
    seed = 7;
    var s = '<path class="land" d="M0,150 L0,96 C10,90 24,92 40,100 C62,112 90,122 120,128 C160,134 200,138 260,142 L260,150 Z"/>';
    s += sway(acacia(32,100,98),32,100,9,0);
    s += sway(pine(88,122,50,19),88,122,7,-2);
    s += sway(pine(104,126,36,14),104,126,6,-4);
    s += sway(pine(70,114,30,12),70,114,8,-1);
    s += sway(pine(124,131,26,11),124,131,6.5,-3);
    s += sway(pine(142,133,20,9),142,133,7.5,-5);
    return s;
  }
  function shoreRight(){
    seed = 23;
    var s = '<path class="land" d="M200,140 L200,88 C192,82 178,86 162,94 C142,104 118,114 92,121 C60,129 30,135 0,138 L0,140 Z"/>';
    s += sway(pine(180,93,64,24),180,93,8,-1);
    s += sway(pine(164,100,44,18),164,100,7,-3);
    s += sway(pine(194,92,44,16),194,92,6.5,-2);
    s += sway(pine(148,108,30,13),148,108,7.5,-4);
    s += sway(pine(132,113,22,10),132,113,6,-1.5);
    return s;
  }
  var SL = shoreLeft(), SR = shoreRight();
  $('shoreL').innerHTML = SL; $('shoreLr').innerHTML = SL;
  $('shoreR').innerHTML = SR; $('shoreRr').innerHTML = SR;

  // ============ BIRDS (big, flapping wings, flocks) ============
  (function(){
    var A = 'M2,6 C14,8 26,18 40,26 C54,18 66,8 78,6 C68,20 56,28 44,32 L40,34 L36,32 C24,28 12,20 2,6 Z';
    var B = 'M0,22 C14,18 26,22 40,28 C54,22 66,18 80,22 C68,28 56,32 44,34 L40,35 L36,34 C24,32 12,28 0,22 Z';
    var C = 'M2,40 C14,34 26,32 40,30 C54,32 66,34 78,40 C68,38 56,36 44,36 L40,37 L36,36 C24,36 12,38 2,40 Z';
    var vals = [A,B,C,B,A].join(';');
    var flock = [
      {s:86,t:.20,d:34,l:-6,  r:0},
      {s:62,t:.265,d:34,l:-8.2,r:0},
      {s:50,t:.15,d:34,l:-9.4,r:0},
      {s:46,t:.33,d:42,l:-24, r:1},
      {s:34,t:.385,d:42,l:-26.5,r:1},
      {s:30,t:.10,d:52,l:-31, r:0},
      {s:24,t:.29,d:60,l:-15, r:1}
    ];
    var h = '';
    flock.forEach(function(b, n){
      var flap = (0.8 + (b.s/86)*0.5).toFixed(2), off = (n*0.23).toFixed(2);
      h += '<div class="bird'+(b.r?' rev':'')+'" style="top:calc(var(--hz)*'+b.t+');animation-duration:'+b.d+'s;animation-delay:'+b.l+'s">'
        + '<div class="bob" style="animation-delay:-'+(n*0.7).toFixed(1)+'s;animation-duration:'+(3+n*0.35).toFixed(2)+'s">'
        + '<svg viewBox="0 0 80 42" width="'+b.s+'" height="'+(b.s*0.525).toFixed(1)+'" style="opacity:'+(b.s>40?.95:.75)+'">'
        + '<path fill="#12051A" d="'+A+'"><animate attributeName="d" dur="'+flap+'s" begin="-'+off+'s" repeatCount="indefinite" values="'+vals
        + '" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/></path></svg></div></div>';
    });
    $('birds').innerHTML = h;
  })();

  // ============ RADIAL VISUALIZER (sun rays around the art) ============
  var RAYS = 64, raysEl = $('rays'), haloEl = $('halo'), reflEl = $('refl'), reflGlow = $('reflGlow');
  var rayKids = [], rayMap = [];
  (function(){
    for (var k = 0; k < RAYS; k++) {
      var deg = k*360/RAYS;
      var p = document.createElement('div'); p.className = 'ray';
      p.style.transform = 'rotate('+deg.toFixed(2)+'deg) translateY(calc(var(--sun) / 2 + 9px))';
      var i = document.createElement('i'), f = (k % 2 === 0) ? 1 : 0.64;
      i.style.setProperty('--f', f);
      i.style.animationDuration = (1.8 + Math.random()*2.4).toFixed(2)+'s';
      i.style.animationDelay = '-'+(Math.random()*3).toFixed(2)+'s';
      p.appendChild(i); raysEl.appendChild(p);
      rayKids.push(i);
      var d = Math.abs(deg - 180)/180;          // 0 = top (bass), 1 = bottom (treble)
      rayMap.push({pos: d*25, gain: 1 + d*0.9, f: f});
    }
  })();

  var vizTimer = null;
  function leaveLive(){
    raysEl.classList.remove('live');
    for (var j = 0; j < rayKids.length; j++) rayKids[j].style.transform = '';
    haloEl.style.opacity = ''; haloEl.style.transform = '';
    reflEl.style.opacity = ''; reflGlow.style.opacity = '';
  }
  // Called by Android ~30x/sec with 26 values (0..100)
  window.updateViz = function(arr){
    if (!arr || !arr.length) return;
    if (!raysEl.classList.contains('live')) raysEl.classList.add('live');
    var n = arr.length;
    for (var k = 0; k < RAYS; k++) {
      var m = rayMap[k], i0 = Math.min(n-1, Math.floor(m.pos)), i1 = Math.min(n-1, i0+1), fr = m.pos - Math.floor(m.pos);
      var v = ((arr[i0] || 0)*(1-fr) + (arr[i1] || 0)*fr)/100;
      v = Math.min(1, Math.pow(v, 0.85)*m.gain);
      rayKids[k].style.transform = 'scaleY('+((0.14 + 0.86*v)*m.f).toFixed(3)+')';
    }
    var bass = Math.min(1, ((arr[0]||0)+(arr[1]||0)+(arr[2]||0)+(arr[3]||0))/400);
    haloEl.style.opacity = (0.72 + 0.28*bass).toFixed(2);
    haloEl.style.transform = 'scale('+(1 + 0.07*bass).toFixed(3)+')';
    reflEl.style.opacity = (0.72 + 0.28*bass).toFixed(2);
    reflGlow.style.opacity = (0.7 + 0.3*bass).toFixed(2);
    clearTimeout(vizTimer);
    // data stops (permission denied / visualizer released) -> back to ambient shimmer
    vizTimer = setTimeout(leaveLive, 1500);
  };

  // ============ PLAYER BRIDGE ============
  function fmt(ms){ var t = Math.max(0, Math.floor(ms/1000)), m = Math.floor(t/60), s = t % 60; return m+':'+(s < 10 ? '0'+s : s); }
  function callAndroid(fn, arg){
    if (window.AndroidPlayer && typeof window.AndroidPlayer[fn] === 'function') {
      if (arg === undefined) window.AndroidPlayer[fn](); else window.AndroidPlayer[fn](arg);
    }
  }
  var duration = 0, isSeeking = false;
  var trackTitle=$('trackTitle'), trackArtist=$('trackArtist'), timeNow=$('timeNow'), timeTotal=$('timeTotal'),
      trackFill=$('trackFill'), trackThumb=$('trackThumb'), playIcon=$('playIcon'), btnPlay=$('btnPlay'),
      favLabel=$('favLabel'), btnFavorite=$('btnFavorite'), btnShuffle=$('btnShuffle'), btnRepeatOne=$('btnRepeatOne'), artEl=$('art');

  function setSeekPercent(p){
    p = Math.max(0, Math.min(100, p));
    trackFill.style.width = p+'%';
    trackThumb.style.left = p+'%';
  }

  window.updatePlayerState = function(title, artist, playing, positionMs, durationMs, favorite, shuffleActive, repeatOneActive){
    trackTitle.textContent = title || 'Unknown track';
    trackArtist.textContent = artist || '';
    duration = durationMs || 0;
    btnFavorite.classList.toggle('liked', !!favorite);
    favLabel.textContent = favorite ? 'Saved' : 'Save';
    btnShuffle.classList.toggle('active', !!shuffleActive);
    btnRepeatOne.classList.toggle('active', !!repeatOneActive);
    if (!isSeeking) {
      timeNow.textContent = fmt(positionMs);
      timeTotal.textContent = fmt(duration);
      setSeekPercent(duration > 0 ? positionMs/duration*100 : 0);
    }
    playIcon.innerHTML = playing
      ? '<rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/>'
      : '<polygon points="6 3 20 12 6 21 6 3"/>';
    btnPlay.classList.toggle('paused', !playing);
    raysEl.classList.toggle('paused', !playing);
  };

  window.updatePlayerArtwork = function(b64){
    var svg = artEl.querySelector('svg');
    if (b64 && b64.length > 0) {
      artEl.classList.remove('placeholder');
      artEl.style.backgroundImage = 'url(data:image/jpeg;base64,'+b64+')';
      svg.style.display = 'none';
    } else {
      artEl.classList.add('placeholder');
      artEl.style.backgroundImage = 'none';
      svg.style.display = '';
    }
  };

  btnPlay.addEventListener('click', function(){ callAndroid('onPlayPause'); });
  $('btnNext').addEventListener('click', function(){ callAndroid('onNext'); });
  $('btnPrev').addEventListener('click', function(){ callAndroid('onPrevious'); });
  btnShuffle.addEventListener('click', function(){ callAndroid('onShuffleToggle'); });
  btnRepeatOne.addEventListener('click', function(){ callAndroid('onRepeatOneToggle'); });
  btnFavorite.addEventListener('click', function(){ callAndroid('onFavoriteToggle'); });
  $('btnCollapse').addEventListener('click', function(){ callAndroid('onCollapse'); });
  $('btnEqualizer').addEventListener('click', function(){ callAndroid('onEqualizer'); });
  $('btnTheme').addEventListener('click', function(){ callAndroid('onTheme'); });

  // ---- seek bar ----
  var seekBar = $('seekBar');
  function pctFrom(e){
    var r = seekBar.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.max(0, Math.min(100, x/r.width*100));
  }
  function seekMove(e){
    if (!isSeeking) return;
    var p = pctFrom(e);
    setSeekPercent(p);
    timeNow.textContent = fmt(duration*p/100);
  }
  seekBar.addEventListener('pointerdown', function(e){
    isSeeking = true;
    try { seekBar.setPointerCapture(e.pointerId); } catch(_){}
    seekMove(e);
  });
  seekBar.addEventListener('pointermove', seekMove);
  seekBar.addEventListener('pointerup', function(e){
    if (!isSeeking) return;
    var p = pctFrom(e);
    isSeeking = false;
    callAndroid('onSeek', Math.round(duration*p/100));
  });
  seekBar.addEventListener('pointercancel', function(){ isSeeking = false; });

  // ---- queue ----
  var qPanel = $('qPanel'), qBackdrop = $('qBackdrop'), qList = $('qList');
  function openQueue(){ qPanel.classList.add('open'); qBackdrop.classList.add('open'); callAndroid('onQueue'); }
  function closeQueue(){ qPanel.classList.remove('open'); qBackdrop.classList.remove('open'); }
  $('btnQueue').addEventListener('click', openQueue);
  $('btnQClose').addEventListener('click', closeQueue);
  qBackdrop.addEventListener('click', closeQueue);
  function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  window.updateQueue = function(items, currentIndex){
    qList.innerHTML = '';
    if (!items || items.length === 0) { qList.innerHTML = '<div class="q-empty">Queue is empty</div>'; return; }
    items.forEach(function(item, i){
      var row = document.createElement('div');
      row.className = 'q-row'+(i === currentIndex ? ' playing' : '');
      row.innerHTML = '<div class="q-num">'+(i+1 < 10 ? '0' : '')+(i+1)+'</div>'
        + '<div class="q-info"><div class="q-t">'+esc(item.title)+'</div><div class="q-s">'+esc(item.subtitle)+'</div></div>'
        + '<div class="q-dot"></div>';
      row.addEventListener('click', function(){
        if (i !== currentIndex) callAndroid('onQueueItemSelect', i);
        closeQueue();
      });
      qList.appendChild(row);
    });
  };
</script>
</body>
</html>
