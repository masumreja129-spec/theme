<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sunset Player</title>
<style>
  :root{
    --bg:#1A0F0B;
    --plum:#2A0F3A;
    --magenta:#B3236B;
    --pink:#FF3D81;
    --orange:#FF7043;
    --gold:#FFC857;
    --white:#FFFFFF;
    --muted:#C9A99B;
    --muted-dim:#8A6B63;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden; color:var(--white);
    font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif; }
  .shell{ position:relative; width:100%; height:100%; overflow:hidden; }

  /* ===== SKY ===== */
  .sky{ position:absolute; inset:0;
    background:linear-gradient(180deg, #1B0B2E 0%, var(--plum) 22%, var(--magenta) 52%, var(--orange) 80%, var(--gold) 100%);
    background-size:100% 140%; animation:skyShift 24s ease-in-out infinite alternate; }
  @keyframes skyShift{ from{ background-position:0 0; } to{ background-position:0 100%; } }
  .dim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,4,14,.55) 0%, rgba(10,4,14,.15) 45%, rgba(10,4,14,.45) 100%); z-index:1; }

  .sun{ position:absolute; left:50%; bottom:11%; width:230px; height:230px; margin-left:-115px; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, #FFF1B8 0%, var(--gold) 38%, var(--orange) 72%, rgba(255,112,67,0) 74%);
    box-shadow:0 0 90px 40px rgba(255,160,70,.45); animation:sunPulse 7s ease-in-out infinite; z-index:0; }
  @keyframes sunPulse{ 0%,100%{ transform:scale(1); opacity:.95; } 50%{ transform:scale(1.06); opacity:1; } }

  .cloud{ position:absolute; height:16px; border-radius:20px; background:rgba(255,200,170,.16); filter:blur(3px); z-index:0; }
  .c1{ top:14%; width:130px; animation:drift 38s linear infinite; }
  .c2{ top:26%; width:90px; animation:drift 52s linear infinite; animation-delay:-20s; opacity:.8; }
  .c3{ top:38%; width:160px; animation:drift 64s linear infinite; animation-delay:-40s; opacity:.6; }
  @keyframes drift{ from{ transform:translateX(-200px);} to{ transform:translateX(110vw);} }

  .birds{ position:absolute; top:11%; left:0; width:100%; height:60px; z-index:1; pointer-events:none; }
  .bird{ position:absolute; width:18px; height:8px; animation:fly 22s linear infinite; }
  .bird svg{ width:100%; height:100%; animation:flap .7s ease-in-out infinite alternate; transform-origin:center; }
  .b2{ top:16px; animation-duration:28s; animation-delay:-9s; transform:scale(.8); }
  .b3{ top:30px; animation-duration:34s; animation-delay:-18s; transform:scale(.65); }
  @keyframes fly{ from{ left:-30px; } to{ left:105%; } }
  @keyframes flap{ from{ transform:scaleY(1);} to{ transform:scaleY(.35);} }

  .waves{ position:absolute; left:0; bottom:0; width:100%; height:15%; z-index:1; pointer-events:none; overflow:hidden; }
  .wave{ position:absolute; left:0; bottom:0; width:200%; height:100%; }
  .wave.w1{ animation:waveMove 14s linear infinite; opacity:.9; }
  .wave.w2{ animation:waveMove 22s linear infinite reverse; opacity:.7; bottom:-6px; }
  @keyframes waveMove{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  /* ===== CONTENT ===== */
  .content{ position:relative; z-index:3; height:100%; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 26px) 24px calc(env(safe-area-inset-bottom,0px) + 22px); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; }
  .topbar-actions{ display:flex; gap:8px; }
  .icon-btn{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(20,6,24,.38); border:1px solid rgba(255,255,255,.14); color:var(--white); backdrop-filter:blur(6px); }
  .eyebrow{ font-size:11px; letter-spacing:3px; font-weight:700; color:#FFE2C8; text-transform:uppercase; }

  .art-wrap{ margin:3vh auto 0; width:min(66vw,36vh); height:min(66vw,36vh); position:relative; flex-shrink:0; }
  .art-ring{ position:absolute; inset:-12px; border-radius:50%; background:conic-gradient(from 0deg, var(--gold), var(--pink), var(--orange), var(--gold));
    filter:blur(16px); opacity:.65; animation:spin 12s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .art{ position:relative; width:100%; height:100%; border-radius:50%; background-size:cover; background-position:center;
    box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .art.spinning{ animation:spin 28s linear infinite; }
  .art.spinning.paused{ animation-play-state:paused; }
  .art.placeholder{ background:radial-gradient(circle at 35% 30%, var(--gold) 0%, var(--orange) 40%, var(--magenta) 100%); }
  .art svg{ width:56px; height:56px; opacity:.55; }

  .track-info{ text-align:center; margin-top:3vh; }
  .track-title{ font-size:21px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 10px rgba(0,0,0,.4); }
  .track-artist{ font-size:13.5px; color:#FFD9C2; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .viz{ display:flex; align-items:flex-end; justify-content:center; gap:3px; height:30px; margin:2vh 6px 0; }
  .viz span{ width:4px; border-radius:2px; background:linear-gradient(to top, var(--orange), var(--gold)); animation:bounce 1.1s ease-in-out infinite; }
  .viz.paused span{ animation-play-state:paused; opacity:.35; }
  /* real FFT mode: CSS animation off, JS drives the height */
  .viz.live span{ animation:none; height:6%; transition:height .08s linear; }
  @keyframes bounce{ 0%,100%{ height:18%;} 50%{ height:100%;} }

  .seek-row{ display:flex; align-items:center; gap:10px; margin-top:2vh; }
  .time{ font-size:11px; color:#FFD9C2; width:34px; }
  .track-bar{ flex:1; height:22px; position:relative; display:flex; align-items:center; touch-action:none; }
  .track-bg{ position:absolute; left:0; right:0; height:4px; border-radius:3px; background:rgba(255,255,255,.22); }
  .track-fill{ position:absolute; left:0; top:50%; transform:translateY(-50%); height:4px; width:0; border-radius:3px; background:linear-gradient(to right, var(--gold), var(--pink)); }
  .track-thumb{ position:absolute; left:0; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 12px rgba(255,200,87,.9); }

  .controls{ display:flex; align-items:center; justify-content:space-between; margin-top:3vh; padding:0 4px; }
  .ctrl-btn{ background:none; border:none; color:#FFE2C8; display:flex; align-items:center; justify-content:center; padding:8px; }
  .ctrl-btn.small{ width:36px; height:36px; opacity:.75; }
  .ctrl-btn.mid{ width:48px; height:48px; color:#fff; }
  .ctrl-btn.active{ opacity:1; color:var(--gold); background:rgba(255,200,87,.18); border-radius:12px; }
  .play-btn{ width:70px; height:70px; border:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--gold), var(--pink)); box-shadow:0 8px 26px rgba(255,61,129,.5); position:relative; transition:transform .15s; }
  .play-btn:active{ transform:scale(.93); }
  .play-btn::after{ content:""; position:absolute; inset:-8px; border-radius:50%; border:1.5px solid rgba(255,200,87,.45); animation:pulseRing 2.6s ease-out infinite; }
  .play-btn.paused::after{ animation-play-state:paused; opacity:0; }
  @keyframes pulseRing{ 0%{ transform:scale(.9); opacity:.7;} 100%{ transform:scale(1.35); opacity:0;} }

  .bottom-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:2vh; }
  .pill{ display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:20px; font-size:12px; color:#FFE2C8;
    background:rgba(20,6,24,.38); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(6px); }
  .pill.liked{ color:var(--gold); border-color:rgba(255,200,87,.6); }

  /* ===== QUEUE ===== */
  .q-backdrop{ position:fixed; inset:0; background:rgba(10,4,14,.6); opacity:0; pointer-events:none; transition:opacity .25s; z-index:4; }
  .q-backdrop.open{ opacity:1; pointer-events:auto; }
  .q-panel{ position:fixed; left:0; right:0; bottom:0; max-height:62vh; background:#241033; border-radius:22px 22px 0 0;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.3,1); z-index:5; display:flex; flex-direction:column; }
  .q-panel.open{ transform:translateY(0); }
  .q-handle{ width:38px; height:4px; border-radius:3px; background:rgba(255,255,255,.2); margin:10px auto 4px; }
  .q-header{ display:flex; align-items:center; justify-content:space-between; padding:8px 18px 10px; }
  .q-title{ font-size:15px; font-weight:800; }
  .q-close{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.1); }
  .q-list{ overflow-y:auto; padding:2px 8px 18px; scrollbar-width:none; }
  .q-list::-webkit-scrollbar{ display:none; }
  .q-row{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; }
  .q-num{ width:22px; text-align:center; font-size:12px; color:var(--muted-dim); }
  .q-info{ flex:1; min-width:0; }
  .q-t{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q-s{ font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q-dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); opacity:0; }
  .q-row.playing{ background:rgba(255,200,87,.14); }
  .q-row.playing .q-t, .q-row.playing .q-num{ color:var(--gold); }
  .q-row.playing .q-dot{ opacity:1; }
  .q-empty{ text-align:center; color:var(--muted-dim); font-size:12.5px; padding:24px 0; }
</style>
</head>
<body>
<div class="shell">

  <div class="sky"></div>
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

  <div class="birds">
    <div class="bird b1"><svg viewBox="0 0 18 8"><path d="M0,6 Q4.5,-2 9,5 Q13.5,-2 18,6" fill="none" stroke="#2A0F3A" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="bird b2"><svg viewBox="0 0 18 8"><path d="M0,6 Q4.5,-2 9,5 Q13.5,-2 18,6" fill="none" stroke="#2A0F3A" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="bird b3"><svg viewBox="0 0 18 8"><path d="M0,6 Q4.5,-2 9,5 Q13.5,-2 18,6" fill="none" stroke="#2A0F3A" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  </div>

  <div class="dim"></div>

  <div class="waves">
    <svg class="wave w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,60 C100,25 200,25 300,60 C400,95 500,95 600,60 C700,25 800,25 900,60 C1000,95 1100,95 1200,60 L1200,120 L0,120 Z" fill="#5A1A55"/></svg>
    <svg class="wave w1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,70 C100,40 200,40 300,70 C400,100 500,100 600,70 C700,40 800,40 900,70 C1000,100 1100,100 1200,70 L1200,120 L0,120 Z" fill="#1A0B2E"/></svg>
  </div>

  <div class="content">
    <div class="topbar">
      <div class="icon-btn" id="btnCollapse"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <div class="eyebrow">Sunset</div>
      <div class="topbar-actions">
        <div class="icon-btn" id="btnEqualizer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></div>
        <div class="icon-btn" id="btnTheme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/></svg></div>
      </div>
    </div>

    <div class="art-wrap">
      <div class="art-ring"></div>
      <div class="art placeholder spinning paused" id="art">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Loading…</div>
      <div class="track-artist" id="trackArtist"></div>
    </div>

    <div class="viz paused" id="viz"></div>

    <div class="seek-row">
      <div class="time" id="timeNow">0:00</div>
      <div class="track-bar" id="seekBar">
        <div class="track-bg"></div><div class="track-fill" id="trackFill"></div><div class="track-thumb" id="trackThumb"></div>
      </div>
      <div class="time" id="timeTotal" style="text-align:right">0:00</div>
    </div>

    <div class="controls">
      <button class="ctrl-btn small" id="btnShuffle"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
      <button class="ctrl-btn mid" id="btnPrev"><svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><rect x="5" y="4" width="2" height="16"/></svg></button>
      <button class="play-btn paused" id="btnPlay"><svg id="playIcon" viewBox="0 0 24 24" width="26" height="26" fill="#2A0F3A"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
      <button class="ctrl-btn mid" id="btnNext"><svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="2" height="16"/></svg></button>
      <button class="ctrl-btn small" id="btnRepeatOne"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="10.5" y="14.5" font-size="7" stroke="none" fill="currentColor">1</text></svg></button>
    </div>

    <div class="bottom-row">
      <div class="pill" id="btnFavorite">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="favLabel">Save</span>
      </div>
      <div class="pill" id="btnQueue">Queue
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
  </div>

  <div class="q-backdrop" id="qBackdrop"></div>
  <div class="q-panel" id="qPanel">
    <div class="q-handle"></div>
    <div class="q-header">
      <div class="q-title">Up Next</div>
      <div class="q-close" id="btnQClose"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="q-list" id="qList"><div class="q-empty">Loading queue…</div></div>
  </div>
</div>

<script>
  // ---- visualizer bars (real FFT data from Android; CSS animation is only a fallback) ----
  var viz = document.getElementById('viz');
  var vizBars = [];
  for (var i = 0; i < 26; i++) {
    var b = document.createElement('span');
    b.style.animationDelay = (Math.random()*1.1).toFixed(2)+'s';
    b.style.animationDuration = (0.8 + Math.random()*0.8).toFixed(2)+'s';
    viz.appendChild(b);
    vizBars.push(b);
  }

  // Called by Android ~30x/sec with 26 values (0..100)
  var vizTimer = null;
  window.updateViz = function(arr){
    if (!arr) return;
    viz.classList.add('live');
    for (var i = 0; i < vizBars.length; i++) {
      vizBars[i].style.height = Math.max(6, arr[i] || 0) + '%';
    }
    clearTimeout(vizTimer);
    // If data stops (permission denied / visualizer released) -> fall back to fake animation
    vizTimer = setTimeout(function(){
      viz.classList.remove('live');
      for (var j = 0; j < vizBars.length; j++) vizBars[j].style.height = '';
    }, 1500);
  };

  function fmt(ms){
    var t = Math.max(0, Math.floor(ms/1000)), m = Math.floor(t/60), s = t % 60;
    return m + ':' + (s < 10 ? '0'+s : s);
  }
  function callAndroid(fn, arg){
    if (window.AndroidPlayer && typeof window.AndroidPlayer[fn] === 'function') {
      if (arg === undefined) window.AndroidPlayer[fn](); else window.AndroidPlayer[fn](arg);
    }
  }
  function $(id){ return document.getElementById(id); }

  var duration = 0, isSeeking = false;
  var trackTitle=$('trackTitle'), trackArtist=$('trackArtist'), timeNow=$('timeNow'), timeTotal=$('timeTotal'),
      trackFill=$('trackFill'), trackThumb=$('trackThumb'), playIcon=$('playIcon'), btnPlay=$('btnPlay'),
      vizEl=$('viz'), favLabel=$('favLabel'), btnFavorite=$('btnFavorite'), btnShuffle=$('btnShuffle'),
      btnRepeatOne=$('btnRepeatOne'), artEl=$('art');

  function setSeekPercent(p){
    p = Math.max(0, Math.min(100, p));
    trackFill.style.width = p + '%';
    trackThumb.style.left = p + '%';
  }

  // ===== Called by Android every tick =====
  window.updatePlayerState = function(title, artist, playing, positionMs, durationMs, favorite, shuffleActive, repeatOneActive){
    trackTitle.textContent = title || 'Unknown track';
    trackArtist.textContent = artist || '';
    duration = durationMs || 0;

    btnFavorite.classList.toggle('liked', !!favorite);
    favLabel.textContent = favorite ? 'Saved' : 'Save';
    btnShuffle.classList.toggle('active', !!shuffleActive);
    btnRepeatOne.classList.toggle('active', !!repeatOneActive);

    if (!isSeeking) {
      timeNow.textContent = fmt(positionMs);
      timeTotal.textContent = fmt(duration);
      setSeekPercent(duration > 0 ? positionMs/duration*100 : 0);
    }
    playIcon.innerHTML = playing
      ? '<rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/>'
      : '<polygon points="6 3 20 12 6 21 6 3"/>';
    btnPlay.classList.toggle('paused', !playing);
    vizEl.classList.toggle('paused', !playing);
    artEl.classList.toggle('paused', !playing);
  };

  // ===== Called by Android once per track (base64 JPEG or "") =====
  window.updatePlayerArtwork = function(b64){
    var svg = artEl.querySelector('svg');
    if (b64 && b64.length > 0) {
      artEl.classList.remove('placeholder');
      artEl.style.backgroundImage = 'url(data:image/jpeg;base64,' + b64 + ')';
      svg.style.display = 'none';
    } else {
      artEl.classList.add('placeholder');
      artEl.style.backgroundImage = 'none';
      svg.style.display = '';
    }
  };

  // ===== Controls -> Android =====
  btnPlay.addEventListener('click', function(){ callAndroid('onPlayPause'); });
  $('btnNext').addEventListener('click', function(){ callAndroid('onNext'); });
  $('btnPrev').addEventListener('click', function(){ callAndroid('onPrevious'); });
  btnShuffle.addEventListener('click', function(){ callAndroid('onShuffleToggle'); });
  btnRepeatOne.addEventListener('click', function(){ callAndroid('onRepeatOneToggle'); });
  btnFavorite.addEventListener('click', function(){ callAndroid('onFavoriteToggle'); });
  $('btnCollapse').addEventListener('click', function(){ callAndroid('onCollapse'); });
  $('btnEqualizer').addEventListener('click', function(){ callAndroid('onEqualizer'); });
  $('btnTheme').addEventListener('click', function(){ callAndroid('onTheme'); });

  // ===== Seek bar =====
  var seekBar = $('seekBar');
  function pctFrom(e){
    var r = seekBar.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.max(0, Math.min(100, x / r.width * 100));
  }
  function seekMove(e){
    if (!isSeeking) return;
    var p = pctFrom(e);
    setSeekPercent(p);
    timeNow.textContent = fmt(duration * p / 100);
  }
  seekBar.addEventListener('pointerdown', function(e){ isSeeking = true; seekMove(e); });
  seekBar.addEventListener('pointermove', seekMove);
  function seekEnd(e){
    if (!isSeeking) return;
    var p = pctFrom(e);
    isSeeking = false;
    callAndroid('onSeek', Math.round(duration * p / 100));
  }
  seekBar.addEventListener('pointerup', seekEnd);
  seekBar.addEventListener('pointercancel', function(){ isSeeking = false; });

  // ===== Queue =====
  var qPanel=$('qPanel'), qBackdrop=$('qBackdrop'), qList=$('qList');
  function openQueue(){ qPanel.classList.add('open'); qBackdrop.classList.add('open'); callAndroid('onQueue'); }
  function closeQueue(){ qPanel.classList.remove('open'); qBackdrop.classList.remove('open'); }
  $('btnQueue').addEventListener('click', openQueue);
  $('btnQClose').addEventListener('click', closeQueue);
  qBackdrop.addEventListener('click', closeQueue);

  function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  // Called by Android: items = [{title, subtitle}], currentIndex
  window.updateQueue = function(items, currentIndex){
    qList.innerHTML = '';
    if (!items || items.length === 0) { qList.innerHTML = '<div class="q-empty">Queue is empty</div>'; return; }
    items.forEach(function(item, i){
      var row = document.createElement('div');
      row.className = 'q-row' + (i === currentIndex ? ' playing' : '');
      row.innerHTML = '<div class="q-num">' + (i+1 < 10 ? '0' : '') + (i+1) + '</div>'
        + '<div class="q-info"><div class="q-t">' + esc(item.title) + '</div><div class="q-s">' + esc(item.subtitle) + '</div></div>'
        + '<div class="q-dot"></div>';
      row.addEventListener('click', function(){
        if (i !== currentIndex) callAndroid('onQueueItemSelect', i);
        closeQueue();
      });
      qList.appendChild(row);
    });
  };
</script>
</body>
</html>
